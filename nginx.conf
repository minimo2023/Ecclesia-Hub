# ================================================================
# Nginx 反向代理閘道 (Reverse Proxy Gateway)
# 職責：依路徑分流，絕不直接提供靜態資源
#
# 流量架構：
#   browser → Cloudflare Tunnel → host:3000 → [nginx]
#                                              ├── /xit-worker/* → xit-worker:3105
#                                              └── /*           → bible-quiz:3000
# ================================================================

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    client_body_timeout 15s;
    send_timeout 30s;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    # ── 上游服務定義 ──────────────────────────────────────────────
    upstream bible_quiz {
        server bible-quiz:3000;
        keepalive 32;
    }

    upstream xit_worker {
        server xit-worker:3105;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        limit_conn connections_per_ip 30;

        # 共用代理標頭
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================
        # 🗓️  XIT-Worker 排班系統 — 完全隔離，獨立進程
        # 此 block 的所有流量完全不觸及 bible-quiz 容器
        # =====================================================
        location /xit-worker/ {
            proxy_pass http://xit_worker;

            # SSE (Server-Sent Events) 長連線支援
            proxy_set_header Connection '';
            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       3600s;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://bible_quiz;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        location ~* "^/(assets|m/assets)/.+\.[0-9a-f]{8,}\.(js|css|png|jpe?g|webp|avif|svg|woff2?)$" {
            proxy_pass http://bible_quiz;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # =====================================================
        # 📖  主網站（聖經智匯）— WebSocket + 手機重導由 Express 處理
        # =====================================================
        location / {
            proxy_pass http://bible_quiz;

            # WebSocket (Socket.io) 升級
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # 禁止訪問隱藏檔案
        location ~ /\. {
            deny all;
        }
    }
}
