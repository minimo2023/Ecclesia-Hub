services:
  bible-quiz:
    command: ["node", "Bible Millionaire Quiz/server/start.js"]
    environment:
      GEMINI_PAID_KEYS: ${GEMINI_PAID_KEYS}
      GEMINI_FREE_KEYS: ${GEMINI_FREE_KEYS}
      GEMINI_MODELS: ${GEMINI_MODELS}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION}
      QUESTION_QUALITY_MODE: shadow
      QUESTION_QUALITY_PATROL_ENABLED: "true"
      QUESTION_QUALITY_PATROL_BATCH_SIZE: "1"
      QUESTION_QUALITY_PATROL_INITIAL_DELAY_SECONDS: "30"
      QUESTION_QUALITY_PATROL_INTERVAL_MINUTES: "30"
      QUESTION_REPLENISHMENT_ENABLED: "true"
